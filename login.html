<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in | TeknTandao</title>
  <link rel="icon" type="image/png" href="assets/images/tekntandao-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
  <link rel="stylesheet" href="assets/css/commerce.css">
  <link rel="stylesheet" href="assets/css/site-pages.css">
</head>
<body class="content-page">
  <nav class="commerce-nav">
    <a class="brand" href="index.html">TeknTandao</a>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
  </nav>
  <main class="commerce-shell narrow-shell">
    <section class="auth-card">
      <span class="badge">Secure account</span>
      <h1>Sign in to TeknTandao</h1>
      <p class="muted">Create an account to pay, track orders and access any staff dashboard assigned to you.</p>
      <label>Name <input id="auth-name" autocomplete="name" placeholder="Your name"></label>
      <label>Email <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label>Password <input id="auth-password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
      <div class="auth-actions">
        <button id="sign-in" class="btn btn-primary">Sign in</button>
        <button id="create-account" class="btn btn-ghost">Create account</button>
        <button id="google-sign-in" class="btn btn-ghost">Continue with Google</button>
        <button id="reset-password" class="link-button">Forgot password?</button>
      </div>
      <p id="auth-status" class="status">Firebase Email/Password or Google authentication.</p>
    </section>
  </main>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/color.js"></script>
  <script src="assets/js/nav-responsive.js"></script>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
