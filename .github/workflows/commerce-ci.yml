name: Commerce CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check assets/js/shop.js
          node --check assets/js/auth-client.js
          node --check assets/js/login.js
          node --check assets/js/account.js
          node --check assets/js/dashboard.js
          node --check assets/js/blog.js
          node --check assets/js/ajax-form.js
          node --check assets/js/color.js
          node --check assets/js/hero-gaming-pc.js
      - name: Validate catalogue JSON
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('data/products.seed.json')); if(!Array.isArray(p)||p.length<5) process.exit(1);"
      - name: Validate uploaded gaming PC GLB
        run: |
          node -e "const fs=require('fs'); const s=[0,1,2,3,4,5].map(i=>fs.readFileSync('assets/models/gaming-pc-user.'+i+'.b64','utf8')).join('').replace(/\\s+/g,''); const b=Buffer.from(s,'base64'); if(b.subarray(0,4).toString()!=='glTF') throw new Error('bad GLB signature'); if(b.length<10000) throw new Error('GLB unexpectedly small'); console.log('GLB bytes',b.length);"
      - name: Validate required web pages and gaming PC hero
        run: |
          for f in shop.html login.html account.html admin.html attendant.html delivery.html blog.html gallery.html events.html training.html podcasts.html awards.html assets/css/commerce.css assets/css/hero-gaming-pc.css assets/js/site-config.js assets/js/hero-gaming-pc.js firestore.rules firebase.json; do test -s "$f" || exit 1; done
          for i in 0 1 2 3 4 5; do test -s "assets/models/gaming-pc-user.$i.b64" || exit 1; done
          grep -q "hero-gaming-pc.js" assets/js/color.js
          grep -q "gaming-pc-user" assets/js/hero-gaming-pc.js
          grep -q "afterend" assets/js/hero-gaming-pc.js
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
