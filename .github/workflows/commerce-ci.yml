name: Commerce CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check assets/js/shop.js
          node --check assets/js/auth-client.js
          node --check assets/js/login.js
          node --check assets/js/account.js
          node --check assets/js/dashboard.js
          node --check assets/js/blog.js
          node --check assets/js/ajax-form.js
      - name: Validate catalogue JSON
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('data/products.seed.json')); if(!Array.isArray(p)||p.length<5) process.exit(1);"
      - name: Validate required web pages
        run: |
          for f in shop.html login.html account.html admin.html attendant.html delivery.html blog.html gallery.html events.html training.html podcasts.html awards.html assets/css/commerce.css assets/js/site-config.js firestore.rules firebase.json; do test -s "$f" || exit 1; done
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
