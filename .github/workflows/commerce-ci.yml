name: Commerce CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check assets/js/shop.js
          node --check assets/js/auth-client.js
          node --check assets/js/login.js
          node --check assets/js/account.js
          node --check assets/js/dashboard.js
          node --check assets/js/blog.js
          node --check assets/js/ajax-form.js
          node --check assets/js/color.js
          node --check assets/js/hero-gaming-pc.js
      - name: Validate catalogue JSON
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('data/products.seed.json')); if(!Array.isArray(p)||p.length<5) process.exit(1);"
      - name: Validate uploaded gaming PC GLB repair
        run: |
          node -e "const fs=require('fs'); const s=[0,1,2,3,4,5].map(i=>fs.readFileSync('assets/models/gaming-pc-user.'+i+'.b64','utf8')).join('').replace(/\\s+/g,''); const raw=Buffer.from(s,'base64'); if(raw.subarray(0,4).toString()!=='glTF') throw new Error('bad GLB signature'); if(raw.readUInt32LE(4)!==2) throw new Error('unsupported GLB version'); const declared=raw.readUInt32LE(8); const missing=declared-raw.length; if(missing<0||missing>4096) throw new Error('unsafe GLB length mismatch '+declared+' != '+raw.length); const b=Buffer.alloc(declared); raw.copy(b); if(b.length!==declared) throw new Error('repair failed'); const jsonLen=b.readUInt32LE(12); if(b.subarray(16,20).toString()!=='JSON') throw new Error('missing JSON chunk'); const binHeader=20+jsonLen; if(binHeader+8>declared) throw new Error('missing BIN header'); const binLen=b.readUInt32LE(binHeader); if(b.subarray(binHeader+4,binHeader+8).toString()!=='BIN\u0000') throw new Error('missing BIN chunk'); if(binHeader+8+binLen!==declared) throw new Error('BIN length mismatch'); console.log('GLB repaired bytes',b.length,'padded',missing);"
      - name: Validate uploaded AI robo Lottie core
        run: |
          node -e "const fs=require('fs'),zlib=require('zlib'); const s=fs.readFileSync('assets/lottie/ai-robo-core.gz.b64','utf8').replace(/\\s+/g,''); const j=JSON.parse(zlib.gunzipSync(Buffer.from(s,'base64')).toString('utf8')); if(j.w!==700||j.h!==700||!Array.isArray(j.layers)||j.layers.length!==3) throw new Error('invalid Lottie core payload'); console.log('Lottie',j.w+'x'+j.h,'layers',j.layers.map(x=>x.nm).join(','));"
      - name: Validate required web pages and hero assets
        run: |
          for f in shop.html login.html account.html admin.html attendant.html delivery.html blog.html gallery.html events.html training.html podcasts.html awards.html assets/css/commerce.css assets/css/hero-gaming-pc.css assets/js/site-config.js assets/js/hero-gaming-pc.js assets/lottie/ai-robo-core.gz.b64 firestore.rules firebase.json; do test -s "$f" || exit 1; done
          for i in 0 1 2 3 4 5; do test -s "assets/models/gaming-pc-user.$i.b64" || exit 1; done
          grep -q "hero-gaming-pc.js" assets/js/color.js
          grep -q "GLTFLoader" assets/js/hero-gaming-pc.js
          grep -q "DecompressionStream" assets/js/hero-gaming-pc.js
          grep -q "tt-ai-robo-lottie" assets/js/hero-gaming-pc.js
          grep -q "ai-robo-core.gz.b64" assets/js/hero-gaming-pc.js
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
