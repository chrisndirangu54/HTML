name: Build security-worker image (execution disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./security-workers
          file: ./security-workers/repository-scan.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tekntandao-security-worker:sha-${{ github.sha }}
      - run: echo "Worker image built only. Live scanner execution remains DISABLED; this image contains no scanner binaries."
