name: Public site navigation checks

on:
  push:
    paths:
      - '*.html'
      - 'assets/js/nav-responsive.js'
      - 'assets/css/site-navigation.css'
      - 'tests/site-navigation.test.cjs'
      - 'tests/isp-shop-ux.test.cjs'
      - 'data/products.json'
      - 'assets/js/commerce.js'
      - 'assets/js/isp-products.js'
      - 'assets/css/isp-shop-pages.css'
      - 'assets/css/home-theme-bridge.css'
      - 'assets/js/home-theme-bridge.js'
      - 'tests/home-theme.test.cjs'
      - 'tests/service-pages-ux.test.cjs'
      - 'tests/site-shop-media-reseller.test.cjs'
      - 'assets/css/service-home-ux.css'
      - '.github/workflows/navigation-ci.yml'
  pull_request:
    paths:
      - '*.html'
      - 'assets/js/nav-responsive.js'
      - 'assets/css/site-navigation.css'
      - 'tests/site-navigation.test.cjs'
      - 'tests/isp-shop-ux.test.cjs'
      - 'data/products.json'
      - 'assets/js/commerce.js'
      - 'assets/js/isp-products.js'
      - 'assets/css/isp-shop-pages.css'
      - 'assets/css/home-theme-bridge.css'
      - 'assets/js/home-theme-bridge.js'
      - 'tests/home-theme.test.cjs'
      - 'tests/service-pages-ux.test.cjs'
      - 'tests/site-shop-media-reseller.test.cjs'
      - 'assets/css/service-home-ux.css'
      - '.github/workflows/navigation-ci.yml'

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/nav-responsive.js
      - run: node --check assets/js/home-theme-bridge.js
      - run: node --check assets/js/commerce.js
      - run: node --check assets/js/isp-products.js
      - run: node --test tests/site-navigation.test.cjs tests/isp-shop-ux.test.cjs tests/home-theme.test.cjs tests/service-pages-ux.test.cjs tests/site-shop-media-reseller.test.cjs
