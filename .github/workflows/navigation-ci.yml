name: Public site navigation checks

on:
  push:
    paths:
      - '*.html'
      - 'assets/js/nav-responsive.js'
      - 'assets/css/site-navigation.css'
      - 'tests/site-navigation.test.cjs'
      - 'tests/isp-shop-ux.test.cjs'
      - 'data/products.json'
      - 'assets/js/commerce.js'
      - 'assets/js/isp-products.js'
      - 'assets/css/isp-shop-pages.css'
      - 'assets/css/home-theme-bridge.css'
      - 'assets/js/home-theme-bridge.js'
      - 'tests/home-theme.test.cjs'
      - 'tests/home-gaming-reel-position.test.cjs'
      - 'assets/css/hero-gaming-pc.css'
      - 'tests/service-pages-ux.test.cjs'
      - 'tests/site-shop-media-reseller.test.cjs'
      - 'tests/operational-dashboards.test.cjs'
      - 'tests/expanded-ict-catalog.test.cjs'
      - 'tests/microsoft-storefront.test.cjs'
      - 'tests/cloud-microsoft-section.test.cjs'
      - 'tests/web3-studio.test.cjs'
      - 'tests/web3-visuals.test.cjs'
      - 'tests/engineering-studio.test.cjs'
      - 'tests/engineering-cad-viewer.test.cjs'
      - 'tests/engineering-plate-simulation.test.cjs'
      - 'assets/js/engineering-simulator.js'
      - 'assets/js/engineering-cad-viewer.js'
      - 'assets/images/engineering/mounting-plate-placeholder.svg'
      - 'tests/open-visuals-nft.test.cjs'
      - 'assets/css/open-visuals.css'
      - 'assets/css/real-photography.css'
      - 'docs/real-photo-sources.md'
      - 'assets/images/open-art/**'
      - 'assets/js/engineering-studio.js'
      - 'assets/js/engineering-models.js'
      - 'assets/css/engineering-studio.css'
      - 'assets/images/engineering/**'
      - 'assets/css/web3-visuals.css'
      - 'assets/js/web3-visuals.js'
      - 'assets/images/web3/**'
      - 'assets/js/web3-studio.js'
      - 'assets/css/web3-studio.css'
      - 'assets/css/microsoft-cloud-section.css'
      - 'assets/js/microsoft-store.js'
      - 'assets/css/microsoft-store.css'
      - 'assets/css/shop-expansion.css'
      - 'assets/images/shop/**'
      - 'assets/js/media-cloud-dashboard.js'
      - 'assets/css/media-cloud-dashboard.css'
      - 'assets/css/service-home-ux.css'
      - '.github/workflows/navigation-ci.yml'
  pull_request:
    paths:
      - '*.html'
      - 'assets/js/nav-responsive.js'
      - 'assets/css/site-navigation.css'
      - 'tests/site-navigation.test.cjs'
      - 'tests/isp-shop-ux.test.cjs'
      - 'data/products.json'
      - 'assets/js/commerce.js'
      - 'assets/js/isp-products.js'
      - 'assets/css/isp-shop-pages.css'
      - 'assets/css/home-theme-bridge.css'
      - 'assets/js/home-theme-bridge.js'
      - 'tests/home-theme.test.cjs'
      - 'tests/home-gaming-reel-position.test.cjs'
      - 'assets/css/hero-gaming-pc.css'
      - 'tests/service-pages-ux.test.cjs'
      - 'tests/site-shop-media-reseller.test.cjs'
      - 'tests/operational-dashboards.test.cjs'
      - 'tests/expanded-ict-catalog.test.cjs'
      - 'tests/microsoft-storefront.test.cjs'
      - 'tests/cloud-microsoft-section.test.cjs'
      - 'tests/web3-studio.test.cjs'
      - 'tests/web3-visuals.test.cjs'
      - 'tests/engineering-studio.test.cjs'
      - 'tests/engineering-cad-viewer.test.cjs'
      - 'tests/engineering-plate-simulation.test.cjs'
      - 'assets/js/engineering-simulator.js'
      - 'assets/js/engineering-cad-viewer.js'
      - 'assets/images/engineering/mounting-plate-placeholder.svg'
      - 'tests/open-visuals-nft.test.cjs'
      - 'assets/css/open-visuals.css'
      - 'assets/css/real-photography.css'
      - 'docs/real-photo-sources.md'
      - 'assets/images/open-art/**'
      - 'assets/js/engineering-studio.js'
      - 'assets/js/engineering-models.js'
      - 'assets/css/engineering-studio.css'
      - 'assets/images/engineering/**'
      - 'assets/css/web3-visuals.css'
      - 'assets/js/web3-visuals.js'
      - 'assets/images/web3/**'
      - 'assets/js/web3-studio.js'
      - 'assets/css/web3-studio.css'
      - 'assets/css/microsoft-cloud-section.css'
      - 'assets/js/microsoft-store.js'
      - 'assets/css/microsoft-store.css'
      - 'assets/css/shop-expansion.css'
      - 'assets/images/shop/**'
      - 'assets/js/media-cloud-dashboard.js'
      - 'assets/css/media-cloud-dashboard.css'
      - 'assets/css/service-home-ux.css'
      - '.github/workflows/navigation-ci.yml'

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/nav-responsive.js
      - run: node --check assets/js/home-theme-bridge.js
      - run: node --check assets/js/commerce.js
      - run: node --check assets/js/isp-products.js
      - run: node --check assets/js/media-cloud-dashboard.js
      - run: node --check assets/js/microsoft-store.js
      - run: node --check assets/js/web3-studio.js
      - run: node --check assets/js/web3-visuals.js
      - run: node --check assets/js/engineering-models.js
      - run: node --check assets/js/engineering-studio.js
      - run: node --check assets/js/engineering-cad-viewer.js
      - run: node --check assets/js/engineering-simulator.js
      - run: node --test tests/site-navigation.test.cjs tests/isp-shop-ux.test.cjs tests/home-theme.test.cjs tests/service-pages-ux.test.cjs tests/site-shop-media-reseller.test.cjs tests/operational-dashboards.test.cjs tests/expanded-ict-catalog.test.cjs tests/microsoft-storefront.test.cjs tests/cloud-microsoft-section.test.cjs tests/web3-studio.test.cjs tests/web3-visuals.test.cjs tests/engineering-studio.test.cjs tests/open-visuals-nft.test.cjs tests/engineering-cad-viewer.test.cjs tests/home-gaming-reel-position.test.cjs tests/engineering-plate-simulation.test.cjs
