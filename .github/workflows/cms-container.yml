name: Build Strapi container and trigger authorized deploy
on:
  push:
    branches: [master]
    paths: ['cms/**', '.github/workflows/cms-container.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tekntandao-strapi
          tags: |
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./cms
          file: ./cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: strapi-production
    steps:
      - name: Request Render deployment through protected hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STRAPI_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Configure the environment secret RENDER_STRAPI_DEPLOY_HOOK after creating the Render service."
            exit 1
          fi
          curl --fail --show-error --silent --retry 2 --max-time 30 -X POST "$RENDER_DEPLOY_HOOK"
      - name: Deployment notice
        run: echo "Deployment requested; verify Render build/deploy logs and API health separately."
