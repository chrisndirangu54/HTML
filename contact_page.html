<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact | TeknTandao</title>
  <link rel="icon" type="image/png" href="assets/images/tekntandao-favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
  <link rel="stylesheet" href="assets/css/commerce.css">
  <link rel="stylesheet" href="assets/css/site-pages.css">
</head>
<body class="content-page">
  <nav class="commerce-nav">
    <a class="brand" href="index.html">TeknTandao</a>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="blog.html">Blogs</a>
    <a href="index.html#contact">Contact</a>
  </nav>
  <main class="commerce-shell narrow-shell">
    <section class="auth-card">
      <span class="badge">Contact</span>
      <h1>Let’s innovate together</h1>
      <p class="muted">From Nairobi, TeknTandao builds intelligent apps, training and ICT installs. Tell us what you want to ship.</p>
      <p><a href="mailto:info@tekntandao.com">info@tekntandao.com</a> · +254 702 258 870</p>
      <form class="contact-form" method="POST" action="https://formcarry.com/s/0DnrPCxY-H-" enctype="multipart/form-data">
        <input type="hidden" name="_gotcha" value="" style="display:none">
        <label>Full name <input type="text" name="full-name" required placeholder="Your full name"></label>
        <label>Email <input type="email" name="email" required placeholder="you@company.com"></label>
        <label>Phone <input type="text" name="phone-number" placeholder="+254…"></label>
        <label>Subject
          <select name="subject" required>
            <option value="">Select a subject</option>
            <option value="app-development">App Development</option>
            <option value="web-development">Web Development</option>
            <option value="data-solutions">Data-Driven Solutions</option>
            <option value="training">Corporate Training</option>
            <option value="smart-devices">Smart Device Installation</option>
          </select>
        </label>
        <label>Message <textarea name="message" required placeholder="Share your vision…"></textarea></label>
        <button class="btn btn-primary" type="submit">Send message</button>
      </form>
    </section>
  </main>
  <script src="assets/js/color.js"></script>
  <script src="assets/js/nav-responsive.js"></script>
</body>
</html>
