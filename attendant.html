<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attendant | TeknTandao Shop</title>
  <link rel="icon" type="image/png" href="assets/images/tekntandao-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
  <link rel="stylesheet" href="assets/css/commerce.css">
  <link rel="stylesheet" href="assets/css/site-pages.css">
</head>
<body class="content-page" data-dashboard="attendant">
  <nav class="commerce-nav">
    <a class="brand" href="index.html">TeknTandao</a>
    <a href="shop.html">Shop</a>
    <a href="account.html">My account</a>
    <button id="sign-out" class="btn btn-ghost">Sign out</button>
  </nav>
  <main class="commerce-shell">
    <section class="dashboard-head">
      <div>
        <span class="badge">Attendant</span>
        <h1>Order preparation</h1>
        <p id="dashboard-session" class="muted">Checking access…</p>
      </div>
    </section>
    <div id="dashboard-error"></div>
    <section id="staff-panels" hidden>
      <div id="dashboard-metrics" class="metric-grid"></div>
      <section class="content-card">
        <h2>Paid and processing orders</h2>
        <p class="muted">Claim a paid order by starting processing, then mark it ready for delivery when packed and verified.</p>
        <div id="staff-orders" class="table-wrap"></div>
      </section>
    </section>
  </main>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/color.js"></script>
  <script src="assets/js/nav-responsive.js"></script>
  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
