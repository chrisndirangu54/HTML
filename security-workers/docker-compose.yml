# Reference-only offline worker. Do not expose Docker daemon or public ports.
services:
  security-worker:
    build: .
    read_only: true
    user: "65532:65532"
    network_mode: "none"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      SCAN_EXECUTION_ENABLED: "false"
    restart: "no"
